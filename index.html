<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>하루가게</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f8f8f5; color: #292d27; }

header {
    background: white; padding: 20px 8%;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #eee; gap: 20px;
}
.logo { font-size: 25px; font-weight: bold; color: #426b50; cursor: pointer; }
nav { display: flex; gap: 18px; flex-wrap: wrap; }
nav button { border: none; background: none; font-size: 14px; cursor: pointer; color: #555; }
nav button:hover { color: #426b50; }

main { max-width: 1100px; margin: 40px auto; padding: 0 20px; min-height: 550px; }

.page { display: none; }
.page.active { display: block; }

h2 { margin-bottom: 20px; }
h3 { margin-bottom: 12px; }

.hero { background: #e9efe7; border-radius: 20px; padding: 60px 40px; margin-bottom: 35px; }
.hero h1 { font-size: 38px; line-height: 1.5; margin-bottom: 15px; }
.hero p { color: #657267; margin-bottom: 25px; }

.main-btn { background: #426b50; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; }
.main-btn:hover { background: #34563f; }
.main-btn:disabled, .sub-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.sub-btn { background: white; color: #426b50; border: 1px solid #426b50; padding: 11px 18px; border-radius: 8px; cursor: pointer; }
.danger-btn { background: white; color: #d34d4d; border: 1px solid #d34d4d; padding: 11px 18px; border-radius: 8px; cursor: pointer; }

.section-box { background: white; padding: 25px; border: 1px solid #eee; border-radius: 14px; margin-bottom: 20px; }

input, textarea, select {
    width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 7px;
    margin: 9px 0 17px; font-size: 14px; font-family: inherit;
}
label { font-size: 14px; font-weight: bold; }
.help { color: #888; font-size: 12px; margin-top: -12px; margin-bottom: 15px; }

.cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
.card { background: white; border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
.card-image { height: 145px; background: #e6e6df; display: flex; justify-content: center; align-items: center; color: #777; }
.card-content { padding: 16px; }
.card-content p { font-size: 13px; color: #777; margin: 8px 0; }

.auth-buttons { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

.role-option { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 15px 0 25px; }
.role-option button { padding: 20px 10px; border: 1px solid #ddd; border-radius: 10px; background: white; cursor: pointer; }
.role-option button.selected { border: 2px solid #426b50; background: #eef3ee; color: #426b50; font-weight: bold; }

.back-btn { background: none; border: none; color: #777; cursor: pointer; margin-bottom: 20px; }
.form-message { font-size: 12px; margin-top: -12px; margin-bottom: 15px; }
.success { color: #34844b; }
.error { color: #d34d4d; }

footer { text-align: center; padding: 35px; color: #999; font-size: 13px; }

/* 공통 대시보드 */
.dashboard-header { background: #e9efe7; padding: 30px; border-radius: 16px; margin-bottom: 25px; }
.dashboard-header h2 { color: #426b50; margin-bottom: 8px; }
.dashboard-header p { color: #657267; font-size: 14px; }

.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; margin-top: 22px; }
.stat-card { background: white; padding: 20px; border-radius: 12px; }
.stat-card p { color: #888; font-size: 13px; margin-bottom: 10px; }
.stat-card h3 { font-size: 24px; color: #426b50; margin: 0; }

.dashboard-menu { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.dashboard-menu button { background: white; border: 1px solid #ddd; color: #555; padding: 12px 17px; border-radius: 8px; cursor: pointer; }
.dashboard-menu button.active { background: #426b50; color: white; border-color: #426b50; }

.owner-panel, .tenant-panel, .visitor-panel { display: none; }
.owner-panel.active, .tenant-panel.active, .visitor-panel.active { display: block; }

.empty-state { background: #f8f8f5; padding: 35px 15px; border-radius: 10px; text-align: center; color: #888; font-size: 14px; line-height: 2; }

.data-item { border: 1px solid #eee; border-radius: 12px; padding: 18px; margin-bottom: 14px; background: white; }
.data-item h3 { color: #426b50; }
.data-item p { font-size: 13px; color: #777; margin-top: 8px; }

.item-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.small-btn { padding: 8px 12px; border: 1px solid #ddd; background: white; border-radius: 7px; cursor: pointer; font-size: 12px; }

.review-item { padding: 17px 0; border-bottom: 1px solid #eee; }
.review-item:last-child { border: none; }
.review-item p { color: #777; font-size: 13px; margin-top: 8px; }

.report-btn { margin-top: 10px; color: #c44; border: 1px solid #e5bcbc; background: white; padding: 7px 12px; border-radius: 6px; cursor: pointer; }

.income-card { background: #e9efe7; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
.income-card p { color: #657267; font-size: 13px; }
.income-card h2 { color: #426b50; margin-top: 10px; }

/* 임차 일정 */
.dday { display: inline-block; padding: 6px 12px; border-radius: 20px; background: #e9efe7; color: #426b50; font-weight: bold; font-size: 13px; margin-top: 10px; }
.dday.today { background: #fff0e4; color: #c46b25; }

/* 방문 스탬프 */
.stamp-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; margin-top: 20px; }
.stamp { background: #f8f8f5; border: 1px solid #ddd; border-radius: 12px; padding: 20px 10px; text-align: center; }
.stamp-icon {
    width: 60px; height: 60px; border: 2px dashed #426b50; color: #426b50; border-radius: 50%;
    display: flex; justify-content: center; align-items: center; margin: 0 auto 12px; font-size: 24px;
}
.stamp p { font-size: 12px; color: #777; margin-top: 5px; }
.stamp-count { color: #426b50; font-weight: bold; margin-top: 25px; }

/* 영수증 인증 */
.receipt-actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
.receipt-actions button { flex: 1; min-width: 150px; padding: 16px 18px; font-size: 15px; }

.receipt-preview { margin-bottom: 15px; }
.receipt-preview img { display: block; max-width: 100%; max-height: 360px; margin: 0 auto; border-radius: 10px; border: 1px solid #eee; }

.receipt-status { font-size: 14px; padding: 14px 16px; border-radius: 10px; margin-bottom: 15px; display: none; }
.receipt-status.show { display: block; }
.receipt-status.loading { background: #f1f4f0; color: #426b50; }
.receipt-status.error { background: #fdf0f0; color: #c44; }
.receipt-status.success { background: #eef6ef; color: #34844b; }

.spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #c5d4c8; border-top-color: #426b50; border-radius: 50%;
    animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.receipt-result { border: 2px solid #426b50; border-radius: 12px; padding: 20px; margin-bottom: 15px; background: #fbfdfb; }
.receipt-result.unmatched { border-color: #e5bcbc; background: #fffafa; }

.receipt-row { display: flex; justify-content: space-between; gap: 15px; padding: 9px 0; border-bottom: 1px dashed #e4e4e4; font-size: 14px; }
.receipt-row:last-of-type { border-bottom: none; }
.receipt-row span:first-child { color: #888; }
.receipt-row span:last-child { font-weight: bold; text-align: right; }

.receipt-refund { background: #e9efe7; border-radius: 10px; padding: 15px; margin: 15px 0; text-align: center; color: #426b50; }
.receipt-refund strong { display: block; font-size: 26px; margin-top: 5px; }

/* 카메라 촬영 창 (PC 웹캠) */
.camera-modal {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.75); justify-content: center; align-items: center; padding: 20px;
}
.camera-modal.show { display: flex; }
.camera-box { background: white; border-radius: 14px; padding: 16px; width: 100%; max-width: 720px; }
.camera-box p { color: #777; font-size: 13px; margin-bottom: 10px; text-align: center; }
.camera-box video { display: block; width: 100%; border-radius: 10px; background: #000; }
.camera-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
.camera-buttons button { min-width: 130px; }

/* 동해페이 */
.pay-highlight { background: #e9efe7; padding: 28px; border-radius: 12px; margin-bottom: 20px; }
.pay-highlight h2 { color: #426b50; font-size: 30px; margin-top: 10px; }

/* 삭제 */
.delete-area { border-top: 1px solid #eee; padding-top: 20px; margin-top: 25px; }

@media(max-width:700px) {
    header { flex-direction: column; }
    nav { justify-content: center; gap: 12px; }
    .cards { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr; }
    .role-option { grid-template-columns: 1fr; }
    .stamp-grid { grid-template-columns: repeat(2,1fr); }
    .hero h1 { font-size: 28px; }
}
</style>
</head>

<body>

<header>
    <div class="logo" onclick="showPage('home')">하루가게.</div>
    <nav>
        <button onclick="showPage('home')">홈</button>
        <button onclick="showPage('renter')">점포 찾기</button>
        <button onclick="showPage('owner')">점포 등록</button>
        <button onclick="showPage('community')">커뮤니티</button>
        <button onclick="showPage('mypage')">마이페이지</button>
    </nav>
</header>

<main>

<!-- 홈 -->
<section id="home" class="page active">
    <div class="hero">
        <h1>빈 가게에<br>새로운 하루를.</h1>
        <p>하루만 빌려도 괜찮아요.<br>당신의 새로운 시작을 하루가게가 연결합니다.</p>
